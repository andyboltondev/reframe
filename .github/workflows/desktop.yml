name: Desktop builds and releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the installers as a GitHub release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Version tag to use when publishing (for example, v0.1.0)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: apple-silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: intel
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: reframe-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Give installers friendly names
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          rename_one() {
            pattern="$1"
            destination="$2"
            mapfile -t matches < <(find release-artifacts -type f -name "$pattern")

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one file matching $pattern, found ${#matches[@]}"
              exit 1
            fi

            mv "${matches[0]}" "release-artifacts/$destination"
          }

          rename_one 'Reframe_*_aarch64.dmg' "Reframe_${version}_Apple-Silicon.dmg"
          rename_one 'Reframe_*_x64.dmg' "Reframe_${version}_Intel.dmg"
          rename_one 'Reframe_*_x64_en-US.msi' "Reframe_${version}_x64.msi"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: Reframe ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
