[package]
name = "reframe"
version = "0.2.0"
description = "Reframe — convert, resize and optimise images locally"
authors = ["Reframe"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
